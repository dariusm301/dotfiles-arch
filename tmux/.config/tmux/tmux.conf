# --- General, TrueColor & Neovim Compatibility ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"

# Allow Neovim & Kitty to use OSC 52 clipboard directly without tmux blocking it
set -g set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard'

# Pass extended key sequences (Ctrl+Enter, Shift+Tab, etc.) cleanly to Neovim
set -g extended-keys on
set -as terminal-features ',xterm-kitty:extkeys'

# Eliminate Esc lag in Neovim and enable FocusGained/Lost events
set -sg escape-time 0
set -g focus-events on

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# --- Prefix & Ergonomic Splits ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (Only triggers AFTER pressing Prefix Ctrl+a, never conflicts with nvim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# --- Tmux Copy Mode (Only active when in Prefix + [) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# --- Pane Borders (Matches Hyprland Cyan/Slate) ---
set -g pane-border-style "fg=#2c353f"
set -g pane-active-border-style "fg=#56b6c2"

# --- Status Bar (Transparent & Minimalist Pills) ---
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#c5c8c6"

set -g status-left-length 40
set -g status-left "#[fg=#1a2026,bg=default]#[fg=#e0e6ed,bg=#1a2026,bold]  #S #[fg=#1a2026,bg=#28313b]#[fg=#81a2be,bg=#28313b] #{?client_prefix,PREFIX ,}#[fg=#28313b,bg=default] "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#1a2026,bg=default]#[fg=#707880,bg=#1a2026] #I:#W #[fg=#1a2026,bg=default]"
setw -g window-status-current-format "#[fg=#28313b,bg=default]#[fg=#81a2be,bg=#28313b,bold] #I:#W #[fg=#28313b,bg=default]"

set -g status-right-length 80
set -g status-right "#[fg=#1a2026,bg=default]#[fg=#81a2be,bg=#1a2026]  #{b:pane_current_path} #[fg=#28313b,bg=#1a2026]#[fg=#c5c8c6,bg=#28313b]  %H:%M #[fg=#28313b,bg=default]"

# --- Messages & Command Prompt ---
set -g message-style "bg=#1a2026,fg=#81a2be,bold"
set -g message-command-style "bg=#1a2026,fg=#c5c8c6"
setw -g mode-style "bg=#28313b,fg=#81a2be,bold"

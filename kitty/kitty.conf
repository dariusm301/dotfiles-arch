# --- Fonts & Rendering ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- Window Layout & Padding ---
window_padding_width 14
placement_strategy   center
hide_window_decorations yes
confirm_os_window_close 0

# --- Transparency & Blur ---
background_opacity 0.88
dynamic_background_opacity yes

# --- Color Scheme (Monochrome / Steel Slate) ---
foreground            #c5c8c6
background            #0d0f11
selection_foreground  #0d0f11
selection_background  #969896

# Cursor
cursor                #eaeaea
cursor_text_color     #0d0f11
cursor_shape          beam
cursor_blink_interval 0.5

# URL highlight
url_color             #81a2be
url_style             straight

# Black
color0 #1d1f21
color8 #373b41

# Red / Muted Crimson
color1 #cc6666
color9 #d54e53

# Green / Pale Sage
color2  #b5bd68
color10 #b9ca4a

# Yellow / Sand
color3  #f0c674
color11 #e7c547

# Blue / Steel Slate
color4  #81a2be
color12 #7aa6da

# Magenta / Cool Grey-Purple
color5  #b294bb
color13 #c397d8

# Cyan / Ice Silver
color6  #8abeb7
color14 #70c0b1

# White
color7  #c5c8c6
color15 #eaeaea

# --- Tab Bar Styling ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #0d0f11
active_tab_background   #81a2be
inactive_tab_foreground #707880
inactive_tab_background #1d1f21
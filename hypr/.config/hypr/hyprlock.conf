background {
    monitor =
    path = screenshot   # blurs your current screen
    blur_size = 7
    blur_passes = 3
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(cdd6f4)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    placeholder_text = <i>Password...</i>
    position = 0, -80
    halign = center
    valign = center
}
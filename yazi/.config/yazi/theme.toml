[mgr]
cwd = { fg = "#81a2be", bold = true }

# Hovered & selected items
hovered         = { fg = "#eceff4", bg = "#232a32", bold = true }
preview_hovered = { underline = true }

# Find / filter highlights
find_keyword  = { fg = "#38b2ac", bold = true, italic = true }
find_position = { fg = "#81a2be", bg = "reset", italic = true }

# Multi-select & yank/cut markers
marker_copied   = { fg = "#38b2ac", bg = "#38b2ac" }
marker_cut      = { fg = "#bf616a", bg = "#bf616a" }
marker_marked   = { fg = "#81a2be", bg = "#81a2be" }
marker_selected = { fg = "#eceff4", bg = "#eceff4" }

# Tab bar
tab_active   = { fg = "#0d0f11", bg = "#38b2ac", bold = true }
tab_inactive = { fg = "#d8dee9", bg = "#232a32" }
tab_width    = 1

# Counter pill (top right)
count_copied   = { fg = "#0d0f11", bg = "#38b2ac" }
count_cut      = { fg = "#0d0f11", bg = "#bf616a" }
count_selected = { fg = "#0d0f11", bg = "#81a2be" }

# Pane borders (teal-cyan matching active Hyprland border)
border_symbol = "│"
border_style  = { fg = "#38b2ac" }

[mode]
normal_main = { fg = "#0d0f11", bg = "#81a2be", bold = true }
normal_alt  = { fg = "#81a2be", bg = "#232a32" }
select_main = { fg = "#0d0f11", bg = "#38b2ac", bold = true }
select_alt  = { fg = "#38b2ac", bg = "#232a32" }
unset_main  = { fg = "#0d0f11", bg = "#d8dee9", bold = true }
unset_alt   = { fg = "#d8dee9", bg = "#232a32" }

[status]
overall   = { fg = "#d8dee9", bg = "#0d0f11" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#eceff4", bold = true }
progress_normal = { fg = "#38b2ac", bg = "#232a32" }
progress_error  = { fg = "#bf616a", bg = "#232a32" }

perm_type  = { fg = "#81a2be" }
perm_read  = { fg = "#38b2ac" }
perm_write = { fg = "#d08770" }
perm_exec  = { fg = "#a3be8c" }
perm_sep   = { fg = "#5c6773" }

[pick]
border   = { fg = "#38b2ac" }
active   = { fg = "#81a2be", bold = true }
inactive = { fg = "#d8dee9" }

[input]
border   = { fg = "#38b2ac" }
title    = { fg = "#81a2be" }
value    = { fg = "#eceff4" }
selected = { bg = "#232a32" }

[completion]
border   = { fg = "#38b2ac" }
active   = { fg = "#eceff4", bg = "#232a32" }
inactive = { fg = "#d8dee9" }

[tasks]
border  = { fg = "#38b2ac" }
title   = { fg = "#81a2be" }
hovered = { fg = "#eceff4", bg = "#232a32" }

[which]
cols            = 3
mask            = { bg = "#0d0f11" }
cand            = { fg = "#38b2ac" }
rest            = { fg = "#5c6773" }
desc            = { fg = "#d8dee9" }
separator       = "  "
separator_style = { fg = "#5c6773" }

[help]
on      = { fg = "#38b2ac" }
run     = { fg = "#81a2be" }
desc    = { fg = "#d8dee9" }
hovered = { bg = "#232a32", bold = true }
footer  = { fg = "#0d0f11", bg = "#81a2be" }

[notify]
title_info  = { fg = "#38b2ac" }
title_warn  = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

[filetype]
rules = [
    # Media
    { mime = "image/*", fg = "#88c0d0" },
    { mime = "{audio,video}/*", fg = "#b48ead" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d08770" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a3be8c" },

    # Fallback
    { url = "*", fg = "#d8dee9" },
    { url = "*/", fg = "#81a2be", bold = true },
]

[main]
font=JetBrainsMono Nerd Font:size=9
dpi-aware=yes
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,keywords
show-actions=yes
terminal=kitty
prompt="❯  "
layer=overlay
lines=8
width=34
horizontal-pad=14
vertical-pad=10
inner-pad=5
line-height=18
letter-spacing=0

[colors]
background=0d0f1199
text=d8dee9ff
prompt=81a2beff
placeholder=5c6773ff
input=eceff4ff
match=81a2beff
selection=232a32b3
